# Kubernetes ServiceAccount for Scenario 5 (Secret Manager + Workload
# Identity). The annotation binds this KSA to the GCP service account
# task-tracker-secrets-demo@<project>.iam.gserviceaccount.com -- that
# binding (`roles/iam.workloadIdentityUser`, scoped to exactly this
# namespace/name pair) was granted out-of-band via gcloud, not from this
# manifest, since it's an IAM policy change rather than a cluster
# resource. No GCP key file exists anywhere in the image or the cluster;
# the pod's identity IS this binding.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-tracker-secrets-demo
  namespace: default
  annotations:
    iam.gke.io/gcp-service-account: task-tracker-secrets-demo@project-3bbf5946-29ef-46e1-8ff.iam.gserviceaccount.com
