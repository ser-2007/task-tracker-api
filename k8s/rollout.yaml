apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: task-tracker-api
  labels:
    app: task-tracker-api
spec:
  # Node pool was upgraded from e2-micro to e2-small (see README — the
  # e2-micro's allocatable memory was ~99% consumed by mandatory GKE system
  # add-ons alone, before any app workload). e2-small has real headroom, so
  # replicas and resource requests below are normal, not a workaround.
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: task-tracker-api
  template:
    metadata:
      labels:
        app: task-tracker-api
    spec:
      containers:
        - name: task-tracker-api
          # Replaced by the CI/CD pipeline: ghcr.io/<owner>/task-tracker-api:<sha>
          image: ghcr.io/ser-2007/task-tracker-api:6835973
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "v2"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # emptyDir on purpose: a single-node free-tier cluster has no
        # ReadWriteMany storage class, and canary creates two ReplicaSets
        # at once. Data is not shared/persisted across pods or rollouts —
        - name: data
          emptyDir: {}
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: { duration: 60s }
        - analysis:
            templates:
              - templateName: success-rate-and-latency
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 100
