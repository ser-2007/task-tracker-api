# Isolated workload for Scenario 4 (HPA / load test). Separate Deployment
# from both the canary Rollout (Scenario 2) and the OOM demo (Scenario 3) --
# shares nothing but the container image and the ArgoCD Application that
# syncs everything under k8s/.
#
# CPU is deliberately tight (50m request / 150m limit). Flask's built-in
# development server handles one request at a time per process, so under
# concurrent load a single pod saturates its CPU limit quickly -- this is
# a realistic, not synthetic, reason horizontal scaling helps: more
# replicas means more requests handled concurrently, not a faster single
# request.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-tracker-api-loadtest
  labels:
    app: task-tracker-api-loadtest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-tracker-api-loadtest
  template:
    metadata:
      labels:
        app: task-tracker-api-loadtest
    spec:
      containers:
        - name: task-tracker-api
          # Pin to the current image tag (copy from k8s/rollout.yaml) --
          # this manifest is intentionally NOT touched by the CI/CD
          # update-manifest job.
          image: ghcr.io/ser-2007/task-tracker-api:59e0ff4
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "loadtest-demo"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: task-tracker-api-loadtest
spec:
  selector:
    app: task-tracker-api-loadtest
  ports:
    - port: 8080
      targetPort: 8080
