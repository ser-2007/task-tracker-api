# Isolated workload for Scenario 5 (GCP Secret Manager + Workload
# Identity). Separate Deployment from the canary Rollout (Scenario 2),
# the OOM demo (Scenario 3), and the load-test Deployment (Scenario 4) --
# shares nothing but the container image and the ArgoCD Application that
# syncs everything under k8s/.
#
# This is the only workload in the cluster using
# serviceAccountName: task-tracker-secrets-demo (see
# k8s/secrets-demo-serviceaccount.yaml), which is what lets it -- and
# only it -- fetch projects/*/secrets/task-tracker-db-password from
# Secret Manager at runtime, with no static credentials file anywhere.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-tracker-api-secrets-demo
  labels:
    app: task-tracker-api-secrets-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-tracker-api-secrets-demo
  template:
    metadata:
      labels:
        app: task-tracker-api-secrets-demo
    spec:
      serviceAccountName: task-tracker-secrets-demo
      containers:
        - name: task-tracker-api
          # Pin to the current image tag (copy from k8s/rollout.yaml) --
          # this manifest is intentionally NOT touched by the CI/CD
          # update-manifest job.
          image: ghcr.io/ser-2007/task-tracker-api:351f4f7
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "secrets-demo"
            - name: SECRETS_DEMO_ENABLED
              value: "true"
            - name: GCP_PROJECT_ID
              value: "project-3bbf5946-29ef-46e1-8ff"
            - name: GCP_SECRET_NAME
              value: "task-tracker-db-password"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: task-tracker-api-secrets-demo
spec:
  selector:
    app: task-tracker-api-secrets-demo
  ports:
    - port: 8080
      targetPort: 8080
