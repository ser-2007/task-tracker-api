# Requires kube-prometheus-stack installed in the cluster (see README --
# this is a shared prerequisite for Scenario 2's canary analysis AND
# Scenario 3's OOMKilled alerting, so install it once, now.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate-and-latency
spec:
  args:
    - name: canary-hash
  metrics:
    - name: success-rate
      interval: 30s
      count: 3
      successCondition: result >= 0.95
      failureLimit: 1
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          # Scoped to canary pods only via pod name (which embeds the
          # pod-template-hash). Querying job="task-tracker-api" alone mixes
          # in the stable ReplicaSet's healthy traffic, which dilutes a bad
          # canary's error rate below the detection threshold -- found by a
          # real test where a 50%-error canary still scored 94-98% success
          # and was wrongly promoted to stable. See README.
          query: |
            scalar(
              sum(rate(flask_http_request_duration_seconds_count{job="task-tracker-api", pod=~".*-{{args.canary-hash}}-.*", status=~"2.."}[1m]))
              /
              sum(rate(flask_http_request_duration_seconds_count{job="task-tracker-api", pod=~".*-{{args.canary-hash}}-.*"}[1m]))
            )
    - name: p95-latency-ms
      interval: 30s
      count: 3
      successCondition: result <= 500
      failureLimit: 1
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: |
            scalar(
              histogram_quantile(0.95,
                sum(rate(flask_http_request_duration_seconds_bucket{job="task-tracker-api", pod=~".*-{{args.canary-hash}}-.*"}[1m])) by (le)
              ) * 1000
            )
